<!doctype html>
<html lang="en" style="background:#02040a;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02040a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Iceland aurora hunter: darkness, moon, clouds and space weather in one go/no-go." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Norðurljós</title>
    <script>
      // Apply saved display prefs before first paint: never flash white or blue at a dark-adapted eye.
      try {
        var s = (JSON.parse(localStorage.getItem('nordurljos-settings') || '{}').state) || {};
        var night = s.nightVision === true || s.theme === 'red';
        var el = document.documentElement;
        el.dataset.mode = night ? 'night' : 'auto';
        if (s.reduceTransparency === 'on') el.dataset.transparency = 'reduced';
        if (s.lowPower) el.dataset.power = 'low';
        if (night) {
          el.style.background = '#000';
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#000000');
        }
      } catch (e) {}
    </script>
  </head>
  <body style="background:inherit;margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
